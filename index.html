<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>판다마켓</title>
  </head>
  <body>
    <header class="header">
      <nav class="navbar">
        <div class="title">
          <a href="index.html">
            <img src="images/logo.png" alt="logo" />
          </a>
        </div>
        <div class="login">
          <a href="/login.html">로그인</a>
        </div>
      </nav>
    </header>
    <main>
      <section class="main-section">
        <h1 class="content">
          <p class="description">
            일상의 모든 물건을<br />
            거래해 보세요
            <a href="/item.html">구경하러 가기</a>
          </p>
          <img src="images/panda1.png" alt="panda1Img" />
        </h1>
      </section>
      <section class="hotitem-section">
        <div class="content">
          <img src="images/hotitem.png" alt="hotitemImg" />
          <div class="description">
            <span>Hot item</span>
            <div class="description-box">
              <h2>
                인기 상품을<br />
                확인해 보세요
              </h2>
              <p>
                가장 HOT한 중고거래 물품을<br />
                판다 마켓에서 확인해 보세요
              </p>
            </div>
          </div>
        </div>
      </section>
      <section class="search-section">
        <div class="content">
          <div class="description">
            <span>Search</span>
            <div class="description-box">
              <h2>
                구매를 원하는<br />
                상품을 검색하세요
              </h2>
              <p>
                구매하고 싶은 물품은 검색해서<br />
                쉽게 찾아보세요
              </p>
            </div>
          </div>
          <img src="images/search.png" alt="searchImg" />
        </div>
      </section>
      <section class="register-section">
        <div class="content">
          <img src="images/register.png" alt="registerImg" />
          <div class="description">
            <span>Register</span>
            <div class="description-box">
              <h2>
                판매를 원하는<br />
                상품을 등록하세요
              </h2>
              <p>
                어떤 물건이든 판매하고 싶은 상품을<br />
                쉽게 등록하세요
              </p>
            </div>
          </div>
        </div>
      </section>
      <section class="footer-section">
        <h1 class="content">
          <p class="description">
            믿을 수 있는<br />
            판다마켓 중고 거래
          </p>
          <img src="images/panda2.png" alt="panda2Img" />
        </h1>
      </section>
      <footer class="footer">
        <div class="content">
          <div class="description">©codeit - 2024</div>
          <div class="qna">
            <a href="/privacy.html">Privacy Policy</a>
            <a href=".faq.html">FAQ</a>
          </div>
          <div class="sns">
            <a href="https://www.facebook.com/?locale=ko_KR" target="_blank">
              <img src="images/facebook.png" alt="facebook" />
            </a>
            <a href="https://x.com/i/flow/login?lang=ko" target="_blank">
              <img src="images/twitter.png" alt="twitter" />
            </a>
            <a href="https://www.youtube.com/" target="_blank">
              <img src="images/youtube.png" alt="youtube" />
            </a>
            <a href="https://www.instagram.com/" target="_blank">
              <img src="images/instargram.png" alt="instargram" />
            </a>
          </div>
        </div>
      </footer>
    </main>
  </body>
</html>
